name: Mission Control cycle trigger

# Mission Control runs locally only, so a GitHub-hosted runner cannot reach it.
# Scheduled cycles now come from Windows Task Scheduler on the owner's machine
# (tools/schedule-cycle.ps1 -> http://127.0.0.1:3000/api/cycle). The former
# `schedule:` trigger was removed; only a manual dispatch remains, and it is
# only useful if MC_BASE_URL points at a reachable instance.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Cadence group to run (4h, daily, 5day) or a single agent id"
        required: false
        default: "4h"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine cadence group for this trigger
        id: group
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          else
            echo "no scheduled trigger: run Mission Control cycles locally" >&2; exit 1
          fi

      - name: Call Mission Control cycle endpoint
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.MC_CRON_SECRET }}" \
            "${{ secrets.MC_BASE_URL }}/api/cycle?group=${{ steps.group.outputs.group }}"
